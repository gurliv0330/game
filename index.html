<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset ="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Split Reality Puzzle Worlddd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <h1>
                SPLIT REALITYY!!!
            </h1>
            <div class="hud-info">
                <span id="level-display"> Level 1</span>
                <button id="undo-btn" onclick="undoMove()">UNDO (Z)</button>
                <button id="reset-btn" onclick="loadLevel(currentLevel)">RESETT GAMEE</button>




            </div>

        </header>

        <main class="split-arena">
            <!-- LEft world: daylight-->
             <section class="world day-world">
                <div class="world-label"> Daylight Meadow</div>
                <div id="day-grid" class="grid-board"></div>
             </section>

             <div class="rift-divider"></div>
             <section class="world night-world">
                <div class="world-label"> Midnight Realm</div>
                <div id="night-grid" class="grid-board"></div>
             </section>
        </main>


        <footer>
            <p> Use <strong> Arrow Keys</strong> or <strong> WASD</strong> to guide Sol and Luna to their portals at the same time!</p>
        </footer>
            <!--Victory Modal-->


            <div id="win-modal" class="modal-overlay">
                <div class="modal-card">
                    <h2 id="modal-title"> Worlds Alignedd!!</h2>
                    <p id="modal-msg"> Sol and Luna reunited across the rift!</p>
                    <button id="next-btn" onclick="nextLevel()"> Next Level</button>

                </div>
            </div>


            <script src="script.js"></script>
        
    </body>






</html>
